<script>
(async function(){
  try {
    const res = await fetch("/api/config");
    if (!res.ok) return;
    const cfg = await res.json();
    if (cfg.gaMeasurementId && cfg.gaMeasurementId.startsWith("G-")) {
      const s1 = document.createElement("script");
      s1.async = true;
      s1.src = "https://www.googletagmanager.com/gtag/js?id=" + cfg.gaMeasurementId;
      document.head.appendChild(s1);
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag("js", new Date());
      gtag("config", cfg.gaMeasurementId, { anonymize_ip: true });
      window.gtag = gtag;
      window.gtag = gtag;
    }
  } catch(e) {}
})();
</script>
<script>
function trackDmEvent(eventName, params) {
  if (typeof window.gtag === "function") {
    window.gtag("event", eventName, params || {});
  }
}
document.addEventListener("click", function(e) {
  const a = e.target.closest("a");
  if (!a) return;
  const href = a.getAttribute("href") || "";
  if (href.startsWith("tel:")) {
    trackDmEvent("click_phone", { phone_number: href.replace("tel:", ""), link_text: (a.textContent || "").trim() });
  } else if (href.includes("wa.me") || href.includes("whatsapp.com")) {
    trackDmEvent("click_whatsapp", { link_url: href, link_text: (a.textContent || "").trim() });
  }
});
</script>
