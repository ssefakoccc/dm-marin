      <text x="30" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Forged Steel Common Rail</text>

      <circle cx="20" cy="162" r="2.5" fill="#0ea5e9"/>
      <text x="30" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Rail Pressure Transducer</text>

      <circle cx="20" cy="188" r="2.5" fill="#0ea5e9"/>
      <text x="30" y="192" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Injector Back-Leak Measurement</text>

