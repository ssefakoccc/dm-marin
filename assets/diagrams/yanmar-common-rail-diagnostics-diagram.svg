      <text x="30" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">High-Speed Solenoid/Piezo</text>
    </g>
    <!-- Connector Arrow 3 -> 4 -->
    <path d="M 644.5 240 L 660.5 240" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="662.5,240 656.5,236 656.5,244" fill="#10b981"/>

