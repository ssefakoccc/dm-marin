      <rect x="0" y="0" width="182.5" height="4" rx="2" fill="#10b981"/>
      
      <!-- Icon Circle -->
      <circle cx="91.25" cy="38" r="22" fill="#10b981" fill-opacity="0.15" stroke="#10b981" stroke-opacity="0.5"/>
      <text x="91.25" y="45" font-family="sans-serif" font-size="18" text-anchor="middle">⚡</text>
      
      <!-- Title -->
      <text x="91.25" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">High-Pressure Pump</text>

