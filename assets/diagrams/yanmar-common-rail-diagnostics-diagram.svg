      <text x="30" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Guardian Limp-Home Mode</text>
    </g>
  <!-- Footer Reference -->
  <text x="45" y="445" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">DM MARİN YAT BAKIM &amp; MÜHENDİSLİK HİZMETLERİ · ISO 8846 / ABYC UYUMLU TEKNİK ŞEMA</text>
