      <rect x="15" y="96" width="152.5" height="24" rx="12" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="91.25" y="112" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">CAN J1939 / NMEA 2000</text>

      <circle cx="20" cy="136" r="2.5" fill="#f59e0b"/>
      <text x="30" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Yanmar Diagnostic Tool (YDT)</text>

      <circle cx="20" cy="162" r="2.5" fill="#f59e0b"/>
      <text x="30" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Live Sensor Telemetry Log</text>

      <circle cx="20" cy="188" r="2.5" fill="#f59e0b"/>
      <text x="30" y="192" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Y-COP Immobilizer Security</text>

