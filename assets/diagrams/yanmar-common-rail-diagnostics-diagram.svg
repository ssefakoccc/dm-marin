<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad_yanmar-common-rail-diagnostics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04131f"/>
      <stop offset="60%" stop-color="#0a253a"/>
      <stop offset="100%" stop-color="#073a56"/>
    </linearGradient>
    <linearGradient id="cardGrad_yanmar-common-rail-diagnostics" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad_yanmar-common-rail-diagnostics" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="shadow_yanmar-common-rail-diagnostics" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="900" height="500" rx="16" fill="url(#bgGrad_yanmar-common-rail-diagnostics)"/>

  <!-- Technical Grid Background -->
  <g stroke="#ffffff" stroke-opacity="0.03" stroke-width="1">
    <path d="M 0 50 L 900 50 M 0 100 L 900 100 M 0 150 L 900 150 M 0 200 L 900 200 M 0 250 L 900 250 M 0 300 L 900 300 M 0 350 L 900 350 M 0 400 L 900 400 M 0 450 L 900 450"/>
    <path d="M 100 0 L 100 500 M 200 0 L 200 500 M 300 0 L 300 500 M 400 0 L 400 500 M 500 0 L 500 500 M 600 0 L 600 500 M 700 0 L 700 500 M 800 0 L 800 500"/>
  </g>

