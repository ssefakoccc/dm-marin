  <text x="35" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="20" font-weight="800">Yanmar 4JH / 6LY Common Rail Diagnostics & Fuel Circuit</text>
  <text x="35" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Denso / Bosch High Pressure Pump, Y-COP Telemetry & Injector Trim Codes</text>

  <!-- Main System Visual Container -->
  <rect x="35" y="125" width="830" height="340" rx="12" fill="url(#cardGrad_yanmar-common-rail-diagnostics)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" filter="url(#shadow_yanmar-common-rail-diagnostics)"/>

    <!-- Node #1: Low-Pressure Delivery -->
    <g transform="translate(55.0, 150)">
      <rect width="182.5" height="290" rx="10" fill="#061928" stroke="#0284c7" stroke-width="1.5" stroke-opacity="0.8"/>
      
      <!-- Top Accent Bar -->
      <rect x="0" y="0" width="182.5" height="4" rx="2" fill="#0284c7"/>
      
      <!-- Icon Circle -->
      <circle cx="91.25" cy="38" r="22" fill="#0284c7" fill-opacity="0.15" stroke="#0284c7" stroke-opacity="0.5"/>
      <text x="91.25" y="45" font-family="sans-serif" font-size="18" text-anchor="middle">⛽</text>
      
      <!-- Title -->
