      <text x="30" y="218" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Self-Bleeding Primer Module</text>
    </g>
    <!-- Connector Arrow 1 -> 2 -->
    <path d="M 239.5 240 L 255.5 240" stroke="#10b981" stroke-width="2.5" stroke-dasharray="4,2"/>
    <polygon points="257.5,240 251.5,236 251.5,244" fill="#10b981"/>

