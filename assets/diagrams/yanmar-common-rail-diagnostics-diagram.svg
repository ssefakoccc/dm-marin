      <circle cx="91.25" cy="38" r="22" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-opacity="0.5"/>
      <text x="91.25" y="45" font-family="sans-serif" font-size="18" text-anchor="middle">💻</text>
      
      <!-- Title -->
      <text x="91.25" y="82" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Y-COP & ECU Telemetry</text>

