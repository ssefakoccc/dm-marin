  <text x="35" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">High-Pressure Pump, EVC Sensor Integration & Aftercooler Circuit</text>

