      <stop offset="0%" stop-color="#04131f"/>
      <stop offset="60%" stop-color="#0a253a"/>
      <stop offset="100%" stop-color="#073a56"/>
    </linearGradient>
    <linearGradient id="cardGrad_volvo-penta-d4-d6-d13" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
    <linearGradient id="accentGrad_volvo-penta-d4-d6-d13" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
