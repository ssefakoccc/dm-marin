  <rect x="35" y="125" width="830" height="340" rx="12" fill="url(#cardGrad_volvo-penta-d4-d6-d13)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" filter="url(#shadow_volvo-penta-d4-d6-d13)"/>

    <!-- Node #1: Primary Filtration -->
    <g transform="translate(55.0, 150)">
