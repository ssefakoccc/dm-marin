<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad-marine-alternator-external-regulator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b2b"/>
      <stop offset="50%" stop-color="#0a2e46"/>
      <stop offset="100%" stop-color="#087f93"/>
    </linearGradient>
    <linearGradient id="cardGrad-marine-alternator-external-regulator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <filter id="glow-marine-alternator-external-regulator" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" rx="16" fill="url(#bgGrad-marine-alternator-external-regulator)"/>

  <!-- Grid lines -->
  <path d="M 0 75 L 800 75 M 0 150 L 800 150 M 0 225 L 800 225 M 0 300 L 800 300 M 0 375 L 800 375" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
  <path d="M 100 0 L 100 450 M 200 0 L 200 450 M 300 0 L 300 450 M 400 0 L 400 450 M 500 0 L 500 450 M 600 0 L 600 450 M 700 0 L 700 450" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Top Header Badge -->
  <rect x="40" y="32" width="220" height="30" rx="15" fill="#19c7df" fill-opacity="0.2" stroke="#19c7df" stroke-width="1.5"/>
  <text x="55" y="52" fill="#19c7df" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="bold" letter-spacing="1">DM MARİN · TEKNİK ŞEMA</text>

  <!-- Central Visual Block -->
  <rect x="40" y="80" width="720" height="330" rx="12" fill="url(#cardGrad-marine-alternator-external-regulator)" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>

  <!-- Title Inside Diagram -->
  <text x="70" y="130" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="22" font-weight="900">Yüksek Akımlı Marin Alternatör ve Balmar</text>
  <text x="70" y="160" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="13">Mühendislik Servis Protokolü &amp; Teşhis Akış Şeması</text>

  <!-- Flow Boxes -->
  <!-- Box 1 -->
  <g transform="translate(70, 190)">
    <rect width="180" height="180" rx="10" fill="#071b2b" stroke="#0284c7" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="#0284c7" fill-opacity="0.2"/>
    <text x="90" y="52" fill="#38bdf8" font-family="sans-serif" font-size="20" text-anchor="middle">🔍</text>
    <text x="90" y="100" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">1. Teşhis &amp; Analiz</text>
    <text x="90" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Elektronik Diagnostik</text>
    <text x="90" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Fiziki Basınç Testi</text>
  </g>

  <!-- Arrow 1-2 -->
  <path d="M 260 280 L 310 280" stroke="#19c7df" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="315,280 305,274 305,286" fill="#19c7df"/>

  <!-- Box 2 -->
  <g transform="translate(320, 190)">
    <rect width="180" height="180" rx="10" fill="#071b2b" stroke="#10b981" stroke-width="2"/>
    <circle cx="90" cy="45" r="24" fill="#10b981" fill-opacity="0.2"/>
    <text x="90" y="52" fill="#4ade80" font-family="sans-serif" font-size="20" text-anchor="middle">⚙️</text>
    <text x="90" y="100" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">2. Orijinal OEM Bakım</text>
    <text x="90" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Sertifikalı Yedek Parça</text>
    <text x="90" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Fabrika Tork Değerleri</text>
  </g>

  <!-- Arrow 2-3 -->
  <path d="M 510 280 L 560 280" stroke="#19c7df" stroke-width="3" stroke-dasharray="6,4"/>
  <polygon points="565,280 555,274 555,286" fill="#19c7df"/>

  <!-- Box 3 -->
  <g transform="translate(570, 190)">
    <rect width="160" height="180" rx="10" fill="#071b2b" stroke="#f59e0b" stroke-width="2"/>
    <circle cx="80" cy="45" r="24" fill="#f59e0b" fill-opacity="0.2"/>
    <text x="80" y="52" fill="#fcd34d" font-family="sans-serif" font-size="20" text-anchor="middle">⚓</text>
    <text x="80" y="100" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold" text-anchor="middle">3. Deniz Testi</text>
    <text x="80" y="125" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Yük Altında Test</text>
    <text x="80" y="145" fill="#94a3b8" font-family="sans-serif" font-size="11" text-anchor="middle">Garanti &amp; Rapor</text>
  </g>
</svg>