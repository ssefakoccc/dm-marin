  <text x="35" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Water-Cooled Asynchronous Stator, Variable Speed & PMGi Power Inverter</text>

