      <text x="30" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">High-Frequency DC Bus Stage</text>

      <circle cx="20" cy="162" r="2.5" fill="#10b981"/>
      <text x="30" y="166" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10.5">Pure Sine Wave Inverter Output</text>

