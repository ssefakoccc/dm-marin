      <rect x="15" y="96" width="152.5" height="24" rx="12" fill="#f59e0b" fill-opacity="0.18"/>
      <text x="91.25" y="112" fill="#f59e0b" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">Active ACP / Zinc-Alum</text>

