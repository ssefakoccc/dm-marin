      <stop offset="0%" stop-color="#04131f"/>
      <stop offset="60%" stop-color="#0a253a"/>
      <stop offset="100%" stop-color="#073a56"/>
    </linearGradient>
    <linearGradient id="cardGrad_volvo-ips-drive-maintenance" x1="0%" y1="0%" x2="0%" y2="100%">
