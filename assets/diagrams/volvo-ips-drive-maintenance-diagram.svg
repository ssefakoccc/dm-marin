  <text x="35" y="105" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12">Upper Gearbox, Forward-Facing Dual Props, Duo-Cone Seals & SUS Steering</text>

