  <rect x="35" y="125" width="830" height="340" rx="12" fill="url(#cardGrad_volvo-ips-drive-maintenance)" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1" filter="url(#shadow_volvo-ips-drive-maintenance)"/>

    <!-- Node #1: Upper Gearbox & Clutch -->
    <g transform="translate(55.0, 150)">
